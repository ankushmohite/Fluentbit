apiVersion: apps/v1

kind: DaemonSet

 

metadata:

  name: fluent-bit

  namespace: logging

  labels:

    app.kubernetes.io/name: fluent-bit

    app.kubernetes.io/component: logging

    app.kubernetes.io/part-of: observability

 

spec:

  selector:

    matchLabels:

      app.kubernetes.io/name: fluent-bit

 

  updateStrategy:

    type: RollingUpdate

    rollingUpdate:

      maxUnavailable: 1

 

  template:

    metadata:

      labels:

        app.kubernetes.io/name: fluent-bit

        app.kubernetes.io/component: logging

        app.kubernetes.io/part-of: observability

 

    spec:

      serviceAccountName: fluent-bit

 

      terminationGracePeriodSeconds: 30

 

      containers:

        - name: fluent-bit

 

          image: docker-prod.ecgcindia.com:443/fluent-bit:3.2.5

          imagePullPolicy: IfNotPresent

 

          args:

            - -c

            - /fluent-bit/etc/fluent-bit.conf

 

          ports:

            - name: http

              containerPort: 2020

              protocol: TCP

 

          resources:

            requests:

              cpu: 50m

              memory: 100Mi

            limits:

              cpu: 250m

              memory: 300Mi

 

          securityContext:

            allowPrivilegeEscalation: false

            capabilities:

              drop:

                - ALL

 

          livenessProbe:

            httpGet:

              path: /

              port: 2020

            initialDelaySeconds: 20

            periodSeconds: 10

            timeoutSeconds: 5

            failureThreshold: 3

 

          readinessProbe:

            httpGet:

              path: /

              port: 2020

            initialDelaySeconds: 5

            periodSeconds: 10

            timeoutSeconds: 5

            failureThreshold: 3

 

          lifecycle:

            preStop:

              exec:

                command:

                  - /bin/sh

                  - -c

                  - sleep 10

 

          volumeMounts:

            - name: config

              mountPath: /fluent-bit/etc

              readOnly: true

 

            - name: varlog

              mountPath: /var/log

              readOnly: true

 

            - name: storage

              mountPath: /var/lib/fluent-bit

 

      volumes:

        - name: config

          configMap:

            name: fluent-bit-config

 

        - name: varlog

          hostPath:

            path: /var/log

            type: Directory

 

        - name: storage

          hostPath:

            path: /var/lib/fluent-bit

            type: DirectoryOrCreate

 
